server {
    listen 80 default_server;
    server_name _;

    root /var/www/gazelle;
    index index.php;

    client_max_body_size 50M;

    # Hide the nginx version banner.
    server_tokens off;

    # Security headers (conservative: no CSP, to avoid breaking inline scripts).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Don't serve the config, SQL dump, VCS, docs or dotfiles.
    location ~ /\.(?!well-known) { deny all; }
    location = /gazelle.sql { deny all; }
    location ^~ /docker/ { deny all; }
    location ^~ /docs/ { deny all; }
    location ~* /classes/.*\.(php|template)$ { deny all; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 120s;
    }
}
