# Redirect all plain HTTP to HTTPS.
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name _;
    http2 on;

    ssl_certificate     /etc/nginx/certs/gazelle.crt;
    ssl_certificate_key /etc/nginx/certs/gazelle.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    root /var/www/gazelle;
    index index.php;

    client_max_body_size 50M;
    server_tokens off;

    # Security headers (no HSTS: it would hard-pin HTTPS, risky with a self-signed cert).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Don't serve the config, SQL dump, VCS, docs or dotfiles.
    location ~ /\.(?!well-known) { deny all; }
    location = /gazelle.sql { deny all; }
    location ^~ /docker/ { deny all; }
    location ^~ /docs/ { deny all; }
    location ~* /classes/.*\.(php|template)$ { deny all; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 120s;
    }
}
