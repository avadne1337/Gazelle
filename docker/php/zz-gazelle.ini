; Gazelle requires short open tags (<? ... ?>)
short_open_tag = On

date.timezone = UTC

; This old codebase uses each() and other 7.x-deprecated constructs; hide the
; deprecation/notice noise so pages render cleanly.
error_reporting = E_ALL & ~E_DEPRECATED & ~E_NOTICE & ~E_STRICT & ~E_WARNING
display_errors = Off
log_errors = On

expose_php = Off
memory_limit = 256M
max_execution_time = 120

upload_max_filesize = 50M
post_max_size = 50M

cgi.fix_pathinfo = 0

; Session/cookie hardening (safe defaults even though Gazelle mostly uses its
; own cookies; the app already sets HttpOnly on its auth cookie).
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
; Don't leak the full filesystem path in error messages.
html_errors = Off

; --- php2shell (CVE-2026-109619) stopgap mitigation ---
; Disables the session upload-progress path that gives confirmed unauthenticated
; RCE on PHP-FPM. Gazelle does not use it. This is a mitigation, NOT a full fix;
; the complete fix is the PHP 7.4 security backport (see docker/DEPLOY.md).
session.upload_progress.enabled = 0
